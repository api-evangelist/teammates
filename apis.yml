aid: teammates
name: Teammates
description: >-
  Teammates ("AI that works") is Super Duper Labs' end-to-end platform for
  designing and managing a virtual AI workforce. Companies create AI teammates
  that autonomously execute natural-language assignments across the SaaS tools
  their human teams already use — Salesforce, GitHub, Gmail, Slack, Google
  Workspace, Microsoft 365, Jira, HubSpot and more — through Smart Tools
  connections, reusable skills, event-driven rules and triggers, a secure
  password manager, and human-in-the-loop escalation. The public SmartTools API
  (api.teammates.work/v1) lets developers enqueue assignments against a named
  tool with a natural-language prompt and retrieve results by polling or webhook.
  Usage-based pricing (Team / Business / Enterprise). Backed by Matrix Partners.
